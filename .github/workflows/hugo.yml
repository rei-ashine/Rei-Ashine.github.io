# Builds the Hugo site on every pull request, push to main and manual run.
# Only runs on main deploy to GitHub Pages; every other run builds and uploads the same artifact without deploying.
name: Build and deploy Hugo site

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Builds pull requests so template errors are caught before merge
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grant no permissions by default; each job requests only what it needs
permissions: {}

# Runs on main share a single "pages" group: runs queued between the in-progress run and the latest
# are skipped, but an in-progress production deployment is never cancelled. Other refs cancel
# superseded runs.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HUGO_VERSION: 0.165.0

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job: identical on every event; the site URL comes from baseURL in config.toml
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  # Deployment job: main only, so manual runs on other branches never publish
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Required by actions/deploy-pages to deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
